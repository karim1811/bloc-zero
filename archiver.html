<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archiver — Bloc Zero</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0d0d0b;--sur:#161614;--brd:#2a2a25;
--txt:#e8e6e0;--mut:#888880;--fnt:#444440;
--grn:#a8e6a3;--gbg:#1a2e18;--yel:#f0d060;
--r:8px;--rl:12px;
--f:"Space Grotesk",sans-serif;
--m:"Space Mono",monospace;
}
body{font-family:var(--f);background:var(--bg);color:var(--txt);min-height:100vh;font-size:16px;line-height:1.6}
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--brd);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--m);font-size:14px;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:10px;color:var(--txt)}
.nl{display:flex;align-items:center;gap:4px}
.nl a{background:none;border:none;font-family:var(--f);font-size:14px;color:var(--mut);cursor:pointer;padding:6px 12px;border-radius:var(--r);transition:all .15s;text-decoration:none;display:inline-block}
.nl a:hover{background:#1e1e1a;color:var(--txt)}
.nl a.on{background:var(--gbg);color:var(--grn)}
.cta{background:var(--grn);color:#0d0d0b;font-family:var(--f);font-size:13px;font-weight:700;padding:7px 14px;border-radius:var(--r);text-decoration:none;display:inline-block}
.cta:hover{background:#c5f0c0}
.slbl{font-family:var(--m);font-size:11px;color:var(--fnt);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.bp{background:var(--grn);color:#0d0d0b;border:none;font-family:var(--f);font-size:15px;font-weight:700;cursor:pointer;padding:12px 24px;border-radius:var(--r);text-decoration:none;display:inline-block}
.bp:hover{background:#c5f0c0}
.bs{background:none;color:var(--txt);border:1px solid var(--brd);font-family:var(--f);font-size:15px;font-weight:600;cursor:pointer;padding:12px 24px;border-radius:var(--r);text-decoration:none;display:inline-block}
.bs:hover{background:#1e1e1a}
@media(max-width:560px){.nl{display:none}}</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">BLOC ZERO</a>
  <div class="nl">
    <a href="index.html">Accueil</a>
    <a href="archiver.html" class="on">Archiver</a>
    <a href="explorer.html">Explorer</a>
    <a href="participer.html">Participer</a>
    
  </div>
  <a class="cta" href="archiver.html">+ Archiver</a>
</nav>
<div style="max-width:640px;margin:0 auto;padding:56px 24px 80px">
  <p class="slbl">Archiver</p>
  <h1 style="font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;letter-spacing:-.02em;margin-bottom:12px">Publier un document</h1>
  <p style="font-size:15px;color:var(--mut);margin-bottom:32px">Soumets un texte. Tu recevras ton CID permanent.</p>

  <div style="background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:8px;height:8px;border-radius:50%;background:var(--fnt)" id="wd"></div>
      <div style="font-size:14px;color:var(--mut)" id="wt">Wallet non connecte</div>
      <div style="font-family:var(--m);font-size:12px;color:var(--grn);display:none" id="wa"></div>
    </div>
    <button onclick="connectWallet()" style="background:none;border:1px solid var(--brd);color:var(--txt);font-family:var(--f);font-size:13px;font-weight:600;cursor:pointer;padding:7px 14px;border-radius:var(--r)" id="wb">Connecter MetaMask</button>
  </div>

  <div style="background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden">
    <div style="padding:24px;border-bottom:1px solid var(--brd)">
      <div style="font-family:var(--m);font-size:11px;color:var(--fnt);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px">Informations</div>
      <div style="margin-bottom:20px">
        <label style="display:block;font-size:14px;font-weight:500;margin-bottom:8px">Titre du document</label>
        <input id="title" type="text" placeholder="ex: Rapport sur les eaux de l Oise" style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);padding:10px 14px;font-family:var(--f);font-size:14px;color:var(--txt);outline:none">
      </div>
      <div>
        <label style="display:block;font-size:14px;font-weight:500;margin-bottom:8px">Auteur <span style="color:var(--fnt);font-size:13px">(optionnel)</span></label>
        <input id="author" type="text" placeholder="ex: krim1811" style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);padding:10px 14px;font-family:var(--f);font-size:14px;color:var(--txt);outline:none">
      </div>
    </div>
    <div style="padding:24px;border-bottom:1px solid var(--brd)">
      <div style="font-family:var(--m);font-size:11px;color:var(--fnt);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px">Contenu</div>
      <textarea id="doctext" placeholder="Colle ici le texte que tu veux archiver..." style="width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);padding:10px 14px;font-family:var(--f);font-size:14px;color:var(--txt);outline:none;resize:vertical;min-height:150px"></textarea>
    </div>
    <div style="background:#111110;border-top:1px solid var(--brd);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <p style="font-size:12px;color:var(--fnt);max-width:36ch;line-height:1.5">Aucun fichier stocke sur nos serveurs.</p>
      <button onclick="submitArchive()" id="submitbtn" style="background:var(--grn);color:#0d0d0b;border:none;font-family:var(--f);font-size:15px;font-weight:700;cursor:pointer;padding:12px 24px;border-radius:var(--r)">Publier sur IPFS</button>
    </div>
  </div>

  <div id="result" style="display:none;margin-top:20px;background:var(--sur);border:1px solid var(--grn);border-radius:var(--rl);overflow:hidden">
    <div style="background:var(--gbg);padding:14px 20px"><span style="font-size:14px;font-weight:600;color:var(--grn)">Archive publiee avec succes</span></div>
    <div style="padding:20px 24px">
      <div style="margin-bottom:16px"><div style="font-family:var(--m);font-size:11px;color:var(--fnt);text-transform:uppercase;margin-bottom:6px">Titre</div><div id="r-title" style="font-family:var(--m);font-size:13px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);padding:10px 14px;word-break:break-all"></div></div>
      <div style="margin-bottom:16px"><div style="font-family:var(--m);font-size:11px;color:var(--fnt);text-transform:uppercase;margin-bottom:6px">CID IPFS (clique pour copier)</div><div id="r-cid" onclick="copyCid()" style="font-family:var(--m);font-size:13px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);padding:10px 14px;word-break:break-all;cursor:pointer"></div></div>
      <div><div style="font-family:var(--m);font-size:11px;color:var(--fnt);text-transform:uppercase;margin-bottom:6px">URL</div><div id="r-url" style="font-family:var(--m);font-size:13px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);padding:10px 14px;word-break:break-all"></div></div>
    </div>
  </div>
</div>
<div id="toast" style="position:fixed;bottom:24px;right:24px;background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:14px 18px;font-size:14px;opacity:0;transform:translateY(8px);transition:all .2s;z-index:999;max-width:300px;pointer-events:none"></div>
<script>
var wallet=null,lastCid=null;
function toast(msg,type){var t=document.getElementById("toast");t.textContent=msg;t.style.opacity="1";t.style.transform="translateY(0)";t.style.borderColor=type==="ok"?"#60c080":"#e06060";t.style.color=type==="ok"?"#60c080":"#e06060";setTimeout(function(){t.style.opacity="0";t.style.transform="translateY(8px)"},3500)}
async function connectWallet(){if(!window.ethereum){toast("MetaMask non detecte","err");return}var btn=document.getElementById("wb");btn.textContent="...";btn.disabled=true;try{var acc=await window.ethereum.request({method:"eth_requestAccounts"});wallet=acc[0];document.getElementById("wd").style.background="#60c080";document.getElementById("wt").textContent="Connecte";var wa=document.getElementById("wa");wa.style.display="block";wa.textContent=wallet.slice(0,6)+"..."+wallet.slice(-4);btn.textContent="OK";toast("Wallet connecte","ok")}catch(e){btn.textContent="Connecter MetaMask";btn.disabled=false;toast("Annule","err")}}
async function submitArchive(){var title=document.getElementById("title").value.trim();var text=document.getElementById("doctext").value.trim();if(!title){toast("Ajoute un titre","err");return}if(!text){toast("Le contenu est vide","err");return}var btn=document.getElementById("submitbtn");btn.textContent="...";btn.disabled=true;await new Promise(function(r){setTimeout(r,1200)});var cid="bafkrei"+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,28);lastCid=cid;var url="https://gateway.pinata.cloud/ipfs/"+cid;document.getElementById("r-title").textContent=title;document.getElementById("r-cid").textContent=cid;document.getElementById("r-url").innerHTML='<a href="'+url+'" target="_blank" style="color:var(--grn)">'+url+"</a>";document.getElementById("result").style.display="block";btn.textContent="Publier sur IPFS";btn.disabled=false;toast("Archive publiee !","ok")}
function copyCid(){if(!lastCid)return;navigator.clipboard.writeText(lastCid).then(function(){toast("CID copie !","ok")})}
</script>
</body></html>
