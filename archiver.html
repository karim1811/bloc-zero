<script>
const WORKER_URL = "https://workers-playground-mute-haze-0834.karimkondua.workers.dev/";

async function submitArchive() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) {
    alert("Entre une URL");
    return;
  }

  const btn = document.getElementById("archiveBtn");
  btn.disabled = true;
  btn.textContent = "En cours...";

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || data.message || "Erreur upload");
    }

    const cid = data.IpfsHash;
    document.getElementById("result").style.display = "block";
    document.getElementById("cidValue").textContent = cid;
    document.getElementById("ipfsLink").href = `https://gateway.pinata.cloud/ipfs/${cid}`;
    document.getElementById("ipfsLink").textContent = `gateway.pinata.cloud/ipfs/${cid}`;
  } catch (e) {
    alert("Erreur : " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Publier sur IPFS";
  }
}
</script>
