<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Archiver – Bloc Zéro</title>
</head>
<body style="background:#111;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0">
<div style="text-align:center;width:400px">
  <h2>Archiver une URL sur IPFS</h2>
  <input id="urlInput" type="text" placeholder="https://..." style="width:100%;padding:10px;margin:10px 0;border-radius:6px;border:none;font-size:14px">
  <button onclick="submitArchive()" id="archiveBtn" style="padding:10px 24px;background:#6c63ff;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer">Publier sur IPFS</button>
  <div id="result" style="display:none;margin-top:20px">
    <p>CID : <span id="cidValue"></span></p>
    <a id="ipfsLink" href="#" target="_blank">Voir sur IPFS</a>
  </div>
</div>
<script>
const JWT = "TON_NOUVEAU_JWT";
async function submitArchive() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) { alert("Entre une URL"); return; }
  const btn = document.getElementById("archiveBtn");
  btn.disabled = true; btn.textContent = "En cours...";
  try {
    const blob = new Blob([url], { type: "text/plain" });
    const form = new FormData();
    form.append("file", blob, "url.txt");
    const res = await fetch("https://api.pinata.cloud/pinning/pinFileToIPFS", {
      method: "POST",
      headers: { Authorization: `Bearer ${JWT}` },
      body: form
    });
    const data = await res.json();
    const cid = data.IpfsHash;
    document.getElementById("result").style.display = "block";
    document.getElementById("cidValue").textContent = cid;
    document.getElementById("ipfsLink").href = `https://gateway.pinata.cloud/ipfs/${cid}`;
    document.getElementById("ipfsLink").textContent = `gateway.pinata.cloud/ipfs/${cid}`;
  } catch(e) { alert("Erreur : " + e.message); }
  finally { btn.disabled = false; btn.textContent = "Publier sur IPFS"; }
}
</script>
</body>
</html>
